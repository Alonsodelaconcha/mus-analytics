[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mus-analytics"
version = "0.1.0"
description = "Motor de estadísticas y estrategia para el mus (variante a 8 reyes)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mus = "mus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Por defecto solo los tests rápidos; los lentos se lanzan aparte con `pytest -m slow`
# (un -m en la línea de órdenes sustituye al de addopts).
addopts = "-ra -m \"not slow\""
markers = ["slow: verificaciones costosas (fuerza bruta, Monte Carlo grandes, tabla de equity completa)"]
