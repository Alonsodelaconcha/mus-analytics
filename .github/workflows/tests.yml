# Tests rápidos del motor (pytest) en cada cambio. Entre otras cosas, avisan si
# los datos versionados de la web han quedado desfasados respecto al motor.
# La publicación de la web va aparte (publicar.yml) y no depende de este flujo.

name: Tests del motor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (tests rápidos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar el paquete
        run: python -m pip install -e ".[dev]"
      - name: Tests rápidos
        run: python -m pytest
